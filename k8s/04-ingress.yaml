apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsu-nodejs-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: devsu-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsu-nodejs-service
                port:
                  number: 80
