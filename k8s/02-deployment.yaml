apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsu-nodejs-app
  labels:
    app: devsu-nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsu-nodejs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: devsu-nodejs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # usuario "node" de la imagen
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: devsu-nodejs
          image: devsu-nodejs-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: devsu-nodejs-config
            - secretRef:
                name: devsu-nodejs-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
